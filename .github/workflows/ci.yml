name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Restore dependencies
        run: dotnet restore UserManagement.sln

      - name: Build
        run: dotnet build UserManagement.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test UserManagement.sln --configuration Release --no-build

      - name: Audit dependencies
        run: dotnet list UserManagement.sln package --vulnerable --include-transitive
